<!doctype html>
<!-- data-theme-default: the theme when the user has not chosen one ("light", "dark" or "system"). -->
<html lang="en" data-theme-default="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Set the theme before first paint so a dark theme never flashes light. Mirrors applyTheme in src/utils/theme.ts.
      (function () {
        var root = document.documentElement;
        var theme = "light";
        try {
          var pref = localStorage.getItem("rye-theme");
          if (pref !== "light" && pref !== "dark" && pref !== "system") pref = root.getAttribute("data-theme-default");
          if (pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches)) theme = "dark";
        } catch (e) {}
        root.setAttribute("data-theme", theme);
        root.style.colorScheme = theme;
        // The accent colour, likewise (applyAccent). Blue is the default and has no attribute.
        try {
          var accent = localStorage.getItem("rye-accent");
          if (/^(graphite|green|teal|purple|pink|orange)$/.test(accent)) root.setAttribute("data-accent", accent);
        } catch (e) {}
      })();
    </script>
    <title>Rye</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/rye.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Lato:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Ledger&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: var(--color-bg); color: var(--color-fg); font-family: 'Lato', sans-serif; }

      /* Markdown body inside chat bubbles */
      .md-body { font-size: 14px; line-height: 1.65; word-break: break-word; font-family: 'Ledger', serif; }
      .md-body p { margin-bottom: 10px; }
      .md-body p:last-child { margin-bottom: 0; }
      .md-body h1, .md-body h2, .md-body h3, .md-body h4 {
        font-family: 'Instrument Serif', serif;
        color: var(--color-fg); font-weight: 400; margin: 14px 0 6px;
      }
      .md-body h1 { font-size: 1.9em; }
      .md-body h2 { font-size: 1.55em; }
      .md-body h3 { font-size: 1.3em; }
      .md-body h4 { font-size: 1.1em; }
      .md-body ul, .md-body ol { padding-left: 20px; margin-bottom: 10px; }
      .md-body li { margin-bottom: 3px; }
      .md-body code {
        font-family: monospace; font-size: 13px;
        background: var(--color-surface); border: 1px solid var(--color-border);
        border-radius: 4px; padding: 1px 5px; color: var(--color-code);
      }
      .md-body pre {
        background: var(--color-surface); border: 1px solid var(--color-border);
        border-radius: 6px; padding: 12px; margin-bottom: 10px;
        overflow-x: auto;
      }
      .md-body pre code {
        background: none; border: none; padding: 0;
        color: var(--color-fg); font-size: 12.5px; line-height: 1.5;
      }
      .md-body blockquote {
        border-left: 3px solid var(--color-border); padding-left: 12px;
        color: var(--color-fg-muted); margin-bottom: 10px;
      }
      .md-body hr { border: none; border-top: 1px solid var(--color-border); margin: 12px 0; }
      .md-body a { color: var(--color-accent); text-decoration: none; }
      .md-body a:hover { text-decoration: underline; }
      /* GFM tables */
      .md-body table {
        border-collapse: collapse; width: 100%;
        font-size: 13px; margin-bottom: 12px; font-family: monospace;
      }
      .md-body th {
        background: var(--color-surface); color: var(--color-fg-muted); font-weight: 600;
        padding: 6px 10px; border: 1px solid var(--color-border); text-align: left;
      }
      .md-body td {
        padding: 5px 10px; border: 1px solid var(--color-border); color: var(--color-fg);
      }
      .md-body tr:nth-child(even) td { background: var(--color-bg); }
      .md-body tr:nth-child(odd) td { background: var(--color-surface); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
